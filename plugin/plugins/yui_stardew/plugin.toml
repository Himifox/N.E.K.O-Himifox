[plugin]
id = "yui_stardew"
name = "Yui 星露谷驱动"
description = "通过本机 WebSocket Agent Gateway，让 N.E.K.O 驱动 YuiToIssho 执行召唤、跟随、等待和持续工作。"
short_description = "Drive YuiToIssho through its authenticated local WebSocket Agent Gateway."
keywords = [
  "yui",
  "stardew",
  "星露谷",
  "游戏里的你",
  "可以进(?:来|游戏)?了",
  "进来吧",
  "现在能进了",
  "我弄好了",
]
version = "0.1.4"
type = "plugin"
entry = "plugin.plugins.yui_stardew:YuiStardewPlugin"

[plugin.author]
name = "Himifox"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "Yui 星露谷驱动"
entry = "ui/panel.tsx"
mode = "hosted-tsx"
context = "dashboard"
permissions = ["state:read", "action:call"]
