[plugin]
name = "OpenBiliClaw 个性化推荐兼容层"
description = "在插件进程内提供 OpenBiliClaw 浏览器扩展兼容接口，把扩展主动上报的跨平台浏览行为与 NEKO 最近对话共同压缩为非敏感兴趣画像，再调用现有搜索插件发现候选并通过隐私、活跃状态、安静时段和频率门控发起推荐。Cookie 与原始平台事件不会落盘。"
short_description = "OpenBiliClaw browser signals and NEKO conversations, joined by a privacy-aware recommendation plugin."
keywords = [
    "个性化推荐",
    "主动搭话",
    "recommendation",
    "proactive",
]
version = "0.3.0"
id = "proactive_recommender"
entry = "plugin.plugins.proactive_recommender:ProactiveRecommenderPlugin"
passive = true

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "OpenBiliClaw 个性化推荐兼容层"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = [
    "state:read",
    "action:call",
]

[plugin_runtime]
enabled = true
auto_start = true

[openbiliclaw]
enabled = true
port = 8421

[recommendation]
enabled = true
shadow_mode = false
memory_bucket = "default"
background_llm = true
daily_limit = 2
min_interval_minutes = 240
quiet_start = "23:00"
quiet_end = "09:00"
score_threshold = 0.72
candidate_ttl_hours = 12
reply_window_minutes = 10
ignored_window_minutes = 30
max_consecutive_ignored = 2
max_idle_seconds = 900
min_user_silence_minutes = 20

[recommendation.sources]
web_search = true
bilibili = true
